name: Collecte des amendements PLF 2027

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures (GitHub retarde ou saute souvent les passages programmés)
  workflow_dispatch:
  push:                      # relance aussi à chaque publication de résumés (la planification GitHub n'est pas fiable)
    branches: [main]
    paths: ["resumes.json", "data.js"]

permissions:
  contents: write

concurrency:
  group: amendements
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger et filtrer les amendements (open data AN)
        run: python scripts/build_amendements.py amendements.json
      - name: Publier si changement
        run: |
          git config user.name "veille-plf-bot"
          git config user.email "actions@users.noreply.github.com"
          git add amendements.json textes/premiere_partie.json
          if git diff --cached --quiet; then echo "Pas de changement"; exit 0; fi
          git commit -m "Amendements PLF 2027 : collecte du $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
