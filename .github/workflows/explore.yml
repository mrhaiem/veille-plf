name: explore
on: workflow_dispatch
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0"
          for v in v1 v2; do u=https://www.assemblee-nationale.fr/dyn/opendata/RAPPANR5L17B3291-tII-$v.html; curl -sL -A "$UA" -o $v.html -w "$v %{http_code} %{size_download}\n" $u; curl -sL -A "$UA" -o /dev/null -w "pretty %{http_code} %{size_download}\n" https://www.assemblee-nationale.fr/dyn/17/rapports/cion_fin/l17b3291-tii-${v}_rapport-fond; done
          python3 - <<'P'
          import re,html
          for v in ('v1','v2'):
              s=open(v+'.html',encoding='utf-8',errors='replace').read()
              toc=re.findall(r'<a href="#(_Toc\d+)">(.*?)</a>',s,re.S)
              print('==',v,'toc links',len(toc))
              for a,t in toc:
                  t=re.sub(r'\s+',' ',html.unescape(re.sub('<[^>]+>','',t))).strip()
                  if re.match(r'(?i)(article|après|avant)',t): print(a,'|',t[:110])
          P
