name: explore
on: workflow_dispatch
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0"
          for u in https://www.assemblee-nationale.fr/dyn/17/rapports/cion_fin/l17b3291-tii_rapport-fond https://www.assemblee-nationale.fr/dyn/17/rapports/cion_fin/l17b3291-tii-rect_rapport-fond https://www.assemblee-nationale.fr/dyn/17/rapports/cion_fin/l17b3291-tII_rapport-fond https://www.assemblee-nationale.fr/dyn/opendata/RAPPANR5L17B3291-tII.html https://www.assemblee-nationale.fr/dyn/opendata/RAPPANR5L17B3291tII.html https://www.assemblee-nationale.fr/dyn/17/dossiers/PLF_2027; do echo "## $u"; curl -sL -A "$UA" -o p -w '%{http_code} %{url_effective} %{size_download}\n' "$u"; grep -oE 'href="[^"]*3291[^"]*"' p | sort -u | head -20; done
          curl -sL -o d.zip https://data.assemblee-nationale.fr/static/openData/repository/17/loi/dossiers_legislatifs/Dossiers_Legislatifs.json.zip && mkdir d && cd d && unzip -q ../d.zip && grep -rl "B3291" . | head -5 && for f in $(grep -rl "B3291" document 2>/dev/null | head -6); do python3 -c "import json,sys;d=json.load(open(sys.argv[1]))['document'];print(d['uid'],d.get('titres',{}).get('titrePrincipalCourt'),json.dumps(d.get('divisions'))[:600])" $f; done
