name: explore
on: workflow_dispatch
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0"
          curl -sL -o z.zip https://data.assemblee-nationale.fr/static/openData/repository/17/loi/amendements_div_legis/Amendements.json.zip
          mkdir z && cd z && unzip -q ../z.zip && cd ..
          python3 - <<'P'
          import json,glob,re,collections
          fs=[f for f in glob.glob('z/**/*.json',recursive=True) if 'B3210' in f]
          print('files',len(fs))
          C=collections.Counter(); ex={}
          for f in fs:
              s=open(f).read()
              m=re.search(r'"seanceDiscussionRef":\s*("[^"]*"|null|\{[^}]*\})',s)
              n=re.search(r'"numeroLong":\s*"([^"]*)"',s).group(1)
              v=m.group(1) if m else 'ABSENT'
              kind=('CF' if 'CF' in n else ('II' if n.startswith('II') else 'I'))+':'+('vide' if v in ('ABSENT','null','""') else v[:20])
              C[kind]+=1; ex.setdefault(kind,n)
              if n in ('3089','I-3089','I-CF1737'): print(n, v, re.findall(r'"(\w*(?:eunion|eance|xamen)\w*)":\s*("[^"]*"|null)',s))
          for k,c in C.most_common(30): print(c,k,ex[k])
          P
          curl -sL -A "$UA" https://www.assemblee-nationale.fr/dyn/17/comptes-rendus/seance/session-ordinaire-de-2026-2027/troisieme-seance-du-vendredi-16-octobre-2026 -o cr.html; wc -c cr.html
          grep -oE '.{400}3089.{150}' cr.html | head -3
          grep -oE '(id|name)="[^"]{1,40}"' cr.html | sort | uniq -c | sort -rn | head -15
          grep -oE '(id|name)="[^"]{1,40}"' cr.html | head -30
          ls; curl -sL -A "$UA" "https://www.assemblee-nationale.fr/dyn/17/comptes-rendus/cion_fin" -o cf.html; wc -c cf.html; grep -oE 'href="[^"]*comptes-rendus/cion_fin/[^"]*"' cf.html | head -10
