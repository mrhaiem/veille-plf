name: explore
on: workflow_dispatch
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0"
          for v in v1 v2; do curl -sL -A "$UA" -o $v.html https://www.assemblee-nationale.fr/dyn/opendata/RAPPANR5L17B3291-tII-$v.html; done
          python3 - <<'P'
          import re,html
          for v in ('v1','v2'):
              s=open(v+'.html',encoding='utf-8',errors='replace').read()
              print('==',v, 'hrefs#',len(re.findall(r'href="#',s)), 'ids',len(re.findall(r'\b(?:id|name)="',s)))
              for m in list(re.finditer(r'href="#([^"]+)"[^>]*>',s))[:3]: print('HREF',s[m.start()-50:m.start()+300].replace('\n',' '))
              n=0
              for m in re.finditer(r'(?:Article|ARTICLE)(?:\s|&nbsp;|<[^>]+>)+(\d+|liminaire)',s):
                  n+=1
                  if n<6 or (n%40==0): print('ART',repr(s[max(0,m.start()-400):m.start()+120])[:560])
              print('art mentions',n)
          P
