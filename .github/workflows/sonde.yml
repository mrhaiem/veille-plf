name: Sonde Sénat
on:
  push:
    branches: [sonde-senat]
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://mrhaiem.github.io/veille-plf/" "https://mrhaiem.github.io/veille-plf/index.html?v=9"; do
            echo "=== $u"; curl -sSL -D h.txt -o p.html "$u"; grep -i "cache-control\|last-modified\|age:\|location" h.txt
            echo "special: $(grep -c 'id=\"special\"' p.html) renderSpecial(): $(grep -c 'renderSpecial();' p.html) sp-open: $(grep -c sp-open p.html) b-senat: $(grep -c b-senat p.html)"
          done
